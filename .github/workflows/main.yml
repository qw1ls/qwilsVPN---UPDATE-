name: Auto Update VPN Subscription

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждый день в 3 часа ночи
  workflow_dispatch: # Позволяет запускать вручную кнопкой в GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run updater script
        run: python3 update_subs.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git commit -m "Automated update: Checked VPN nodes" || exit 0
          git push
