name: Update VPN Subscription

on:
  schedule:
    - cron: "0 */2 * * *" # каждые 2 часа
  workflow_dispatch: # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Xray-core
        run: |
          python -m pip install --upgrade pip
          pip install requests
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -q /tmp/xray.zip -d /usr/local/bin/xray_bin
          chmod +x /usr/local/bin/xray_bin/xray
          ln -sf /usr/local/bin/xray_bin/xray /usr/local/bin/xray
          xray -version

      - name: Run subscription checker
        run: python main.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt README.md || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sub.txt [skip ci]"
            git push
          fi
