name: Update VPN configs

on:
  schedule:
    # Запуск каждые 50 минут в течение суток (00:00, 00:50, 01:40, 02:30 ...)
    - cron: "0 0 * * *"
    - cron: "50 0 * * *"
    - cron: "40 1 * * *"
    - cron: "30 2 * * *"
    - cron: "20 3 * * *"
    - cron: "10 4 * * *"
    - cron: "0 5 * * *"
    - cron: "50 5 * * *"
    - cron: "40 6 * * *"
    - cron: "30 7 * * *"
    - cron: "20 8 * * *"
    - cron: "10 9 * * *"
    - cron: "0 10 * * *"
    - cron: "50 10 * * *"
    - cron: "40 11 * * *"
    - cron: "30 12 * * *"
    - cron: "20 13 * * *"
    - cron: "10 14 * * *"
    - cron: "0 15 * * *"
    - cron: "50 15 * * *"
    - cron: "40 16 * * *"
    - cron: "30 17 * * *"
    - cron: "20 18 * * *"
    - cron: "10 19 * * *"
    - cron: "0 20 * * *"
    - cron: "50 20 * * *"
    - cron: "40 21 * * *"
    - cron: "30 22 * * *"
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests[socks]"

      - name: Install Xray
        run: |
          set -e
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          xray -version

      - name: Restore blacklist cache
        uses: actions/cache@v4
        with:
          path: blacklist_local.txt
          key: vpn-state-${{ github.run_id }}-${{ hashFiles('blacklist_local.txt') }}
          restore-keys: |
            vpn-state-

      - name: Run checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCES_LIST_URL: https://raw.githubusercontent.com/qw1ls/qwilsVPN---UPDATE-/refs/heads/main/sources.txt
          RU_EGRESS_PROXY: ${{ secrets.RU_EGRESS_PROXY }}
          MAX_TCP_PING_MS: "500"
          TIMEOUT_PER_URL: "4"
          TLS_CHECK_TIMEOUT: "4"
          SPEEDTEST_TIMEOUT: "4"
          MIN_SPEED_MBPS: "1.0"
          PING_WORKERS: "60"
          MAX_WORKERS: "20"
          THIRD_CHECK_WORKERS: "20"
          SPEEDTEST_WORKERS: "16"
          MAX_CANDIDATES: "1200"
          MAX_RUN_SECONDS: "900"
        run: python checker.py

      - name: Commit and push working configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f working_configs.txt subscription.txt blacklist_local.txt || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update antiRKN FREE configs"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
