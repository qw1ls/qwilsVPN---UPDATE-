name: lol

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests[socks]"

      - name: Install Xray
        run: |
          set -e
          sudo bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
          xray -version

      - name: Restore blacklist cache
        uses: actions/cache@v4
        with:
          path: blacklist_local.txt
          key: vpn-state-${{ github.run_id }}-${{ hashFiles('blacklist_local.txt') }}
          restore-keys: |
            vpn-state-

      - name: Run checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCES_LIST_URL: https://raw.githubusercontent.com/qw1ls/qwilsVPN---UPDATE-/refs/heads/main/sources.txt
          RU_EGRESS_PROXY: ${{ secrets.RU_EGRESS_PROXY }}
          MIN_SPEED_MBPS: "0.5"
          SPEED_TEST_URL: "https://speed.cloudflare.com/__down?bytes=3000000"
        run: python checker.py

      - name: Commit and push working configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: update antiRKN FREE configs"
            git push
          fi
