name: Check Cloudflare IPs (RU)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cf-ip-check
  cancel-in-progress: false

jobs:
  check-cf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Cloudflare IP checker
        env:
          # Укажите SOCKS5-прокси в РФ в Secrets репозитория (например socks5://user:pass@ru-ip:1080)
          RU_EGRESS_PROXY: ${{ secrets.RU_EGRESS_PROXY }}
          CF_SNI_HOST: "speed.cloudflare.com"
          SAMPLES_PER_CIDR: "40"
          MAX_PING_MS: "450"
          MIN_SPEED_MBPS: "2.0"
          TOP_LIMIT: "50"
        run: python cf_checker.py

      - name: Commit and push clean CF IPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cf_working_ips.txt cf_top_ips.csv || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update clean Cloudflare IPs"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
